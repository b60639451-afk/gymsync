services:
  - type: web
    name: gymsync-api
    env: node
    buildCommand: "cd backend && npm install && npm run build"
    startCommand: "cd backend && npm start"
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/gymsync.db
    disk:
      name: gymsync-data
      mountPath: /data
      sizeGB: 1
